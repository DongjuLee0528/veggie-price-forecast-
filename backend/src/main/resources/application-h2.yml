spring:
  datasource:
    url: jdbc:h2:mem:forecast;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
forecast:
  seed-dir: ${FORECAST_SEED_DIR:../db/seed/current}
